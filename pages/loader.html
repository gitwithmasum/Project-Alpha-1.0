<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2;url=../index.html">
  <meta name="description" content="Loading the portfolio of Masum Billah.">
  <title>Loading | Masum Billah</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="stylesheet" href="../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../assets/css/portfolio.css">
  <style>
    .loader-screen{min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center}
    .loader-core{position:relative;width:92px;height:92px;margin:0 auto 2rem;border:1px solid rgba(94,234,212,.25);border-radius:50%;box-shadow:0 0 60px rgba(94,234,212,.12)}
    .loader-core::before,.loader-core::after{content:"";position:absolute;border-radius:50%}
    .loader-core::before{inset:11px;border:2px solid transparent;border-top-color:var(--teal);border-right-color:var(--teal);animation:spin 1.2s linear infinite}
    .loader-core::after{inset:31px;background:var(--teal);box-shadow:0 0 22px var(--teal);animation:pulse 1s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{to{transform:scale(.68);opacity:.58}}
  </style>
</head>
<body>
  <main class="loader-screen">
    <div>
      <div class="loader-core" aria-hidden="true"></div>
      <div class="eyebrow mb-2">Initialising portfolio</div>
      <h1 class="h2 fw-bold mb-2">Masum Billah</h1>
      <p class="muted mb-4">Loading web, AI and research signals…</p>
      <a class="btn btn-outline-future" href="../index.html">Enter now</a>
    </div>
  </main>
</body>
</html>
